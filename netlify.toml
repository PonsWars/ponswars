# The showcase on Netlify: the web client with no server behind it, every
# surface in its preview state under the preview banner (apps/web/.env.showcase).
# It is for showing the world to people, not for playing — the game itself is
# served by infra/containers (docs/operations/deployment.md).

[build]
  # `tsc --build` first, as the client's own build does: it compiles the
  # workspace packages the client imports, which a fresh checkout does not have.
  command = "pnpm --filter @ponswars/web exec tsc --build tsconfig.build.json && pnpm --filter @ponswars/web exec vite build --mode showcase --outDir dist-showcase"
  publish = "apps/web/dist-showcase"

[build.environment]
  NODE_VERSION = "22"

# Every route is the same document (§80.1): the world is navigated by camera,
# and a deep link such as /genesis has to reach the page rather than a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The headers web.nginx.conf sets for the real deployment, with nothing to
# connect to: the showcase talks to no API and no socket.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self'"

# Hashed filenames: a changed file is a different URL.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The one file that names the hashed bundles, so it must never be stale.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
