# A whole deployment on one host.
#
#   cp .env.example .env      # then fill it in; every value is required
#   docker compose -f infra/containers/docker-compose.prod.yml #     --profile bundled-database --profile edge up -d --build
#
# See docs/operations/deployment.md. This is the reference composition — the
# order things start in, what each one needs, and what has to be true before the
# first round. Managed PostgreSQL and Redis are OPEN production decisions
# (§59.3), so the database here sits behind a profile: without it, `DATABASE_URL`
# points wherever a deployment decided, and nothing in this file assumes.

name: ponswars

services:
  # -----------------------------------------------------------------------
  # Optional single-host databases, PostgreSQL and Redis (§21.3).
  # `--profile bundled-database` runs both. A managed instance is the
  # production answer for either, and is not this file's to make.
  # -----------------------------------------------------------------------
  postgres:
    profiles: ['bundled-database']
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Deterministic collation, so an ORDER BY behaves the same here as
      # anywhere else regardless of the host locale.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und-x-icu'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published. Nothing outside this network needs to reach the database,
    # and a port published on a host is a port on the internet more often than
    # anyone intends.

  redis:
    profiles: ['bundled-database']
    image: redis:7-alpine
    restart: unless-stopped
    # The server cannot start without Redis (`REDIS_URL` is required): it holds
    # the lease that decides which instance drives the rounds, and the bus the
    # gateway reads them from. appendonly keeps that across a restart. With
    # this service, `REDIS_URL=redis://redis:6379`.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published, for the database's reason — and this one has no password,
    # so the compose network is the whole of its protection.

  # -----------------------------------------------------------------------
  # Schema, applied once before the server starts (§49).
  # -----------------------------------------------------------------------
  migrate:
    build:
      context: ../..
      dockerfile: infra/containers/server.Dockerfile
    image: ponswars-server:${PONSWARS_VERSION:-local}
    restart: 'no'
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # -----------------------------------------------------------------------
  # The service: round driver, REST API and realtime gateway (§21.3).
  # -----------------------------------------------------------------------
  server:
    build:
      context: ../..
      dockerfile: infra/containers/server.Dockerfile
    image: ponswars-server:${PONSWARS_VERSION:-local}
    restart: unless-stopped
    # Every parameter in the table, and no defaults: startup reports all of
    # them at once and refuses rather than guessing (§65.2, §102).
    env_file:
      - ../../.env
    # Loopback only: reachable from this host for a check, never from the
    # internet. Players arrive through the edge over the compose network. A port
    # published to the world would be a way round the edge — and round the rate
    # limit, whose idea of the client comes from the edge's X-Forwarded-For.
    ports:
      - '127.0.0.1:${API_PORT}:${API_PORT}'
      - '127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      # Readiness rather than liveness: the process answers `/v1/health` before
      # it has a round, and a container reported healthy in that window is one
      # a load balancer sends traffic to too early.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:${API_PORT}/v1/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # §25 stops the driver between rounds, and a finalization has writes to
    # finish. Long enough for the step in flight; not long enough to hang a
    # deploy.
    stop_grace_period: 45s

  # -----------------------------------------------------------------------
  # Rewards windows (§16.2, §16.3): opens each one where the last ended and
  # snapshots it when its 24 hours are up. Without it no window opens and no
  # War Points ever reach a distribution. Calculating and publishing stay
  # operator commands, each with a check in front of it
  # (docs/operations/rewards-distribution.md).
  # -----------------------------------------------------------------------
  rewards-worker:
    build:
      context: ../..
      dockerfile: infra/containers/server.Dockerfile
    image: ponswars-server:${PONSWARS_VERSION:-local}
    restart: unless-stopped
    command: ['node', 'dist/rewards-worker.js', '--snapshots', '/var/lib/ponswars/snapshots']
    # The same file as the server: the minimum claim, the SPY token and the
    # chain are read under the same names, so the two cannot disagree.
    env_file:
      - ../../.env
    volumes:
      # A snapshot is taken once (§16.3). The file is the only copy of what was
      # taken until it is verified, so it outlives the container.
      - snapshots:/var/lib/ponswars/snapshots
    depends_on:
      migrate:
        condition: service_completed_successfully

  # -----------------------------------------------------------------------
  # The client (§80). Static files; the API and gateway URLs are compiled in.
  # -----------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: infra/containers/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL in .env}
        VITE_WS_URL: ${VITE_WS_URL:?set VITE_WS_URL in .env}
    image: ponswars-web:${PONSWARS_VERSION:-local}
    restart: unless-stopped
    # Loopback only, for the same reason as the server's.
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------------------
  # The edge (`--profile edge`): HTTPS on one domain in front of the client,
  # the API and the gateway, with its certificate obtained and renewed by
  # Caddy. The only service with public ports. See infra/containers/Caddyfile.
  # -----------------------------------------------------------------------
  caddy:
    profiles: ['edge']
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    # Checked here rather than with `${SITE_DOMAIN:?}`: Compose interpolates
    # every service whether its profile runs or not, and that would refuse a
    # deployment that has its own edge. An empty domain would otherwise reach
    # Caddy as a config error that does not say which setting is missing.
    command:
      - sh
      - -c
      - >-
        test -n "$$SITE_DOMAIN" || { echo 'SITE_DOMAIN is not set: put the domain players use in .env' >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      API_PORT: ${API_PORT}
      GATEWAY_PORT: ${GATEWAY_PORT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and its account key. Lost, and every restart asks the
      # certificate authority again, which rate-limits a domain that asks often.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # Fixed, so the API can be told to believe X-Forwarded-For from this
        # address and no other: API_TRUSTED_PROXIES=172.28.0.10.
        ipv4_address: 172.28.0.10
    depends_on:
      - server
      - web

# Pinned, so the edge's address above is a fact the configuration can name.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  redis_data:
  snapshots:
  caddy_data:
  caddy_config:
