# Serving the client (§80, §82.3).
#
# A single-page app over static files: no origin server, no rendering, nothing
# to configure at runtime. The API and gateway URLs were compiled into the
# bundle when it was built, which is why this file has a placeholder for them
# rather than a variable — see `web.Dockerfile`.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # `off` rather than a version: the header is free reconnaissance and says
    # nothing a client needs.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Headers a static host can set truthfully. Everything here is about the
    # document itself; anything that depends on where the API lives is in the
    # policy below, which is written at build time from the same values the
    # bundle was built with.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self'__CONNECT_SRC__" always;

    # Hashed filenames, so a year is not optimistic — a changed file is a
    # different URL. `immutable` stops a reload from revalidating them.
    location /assets/ {
        # One header, not `expires` as well: `expires` emits its own
        # `Cache-Control`, and two of them on one response is a browser's choice
        # rather than ours.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The one file that must never be cached. It names the hashed bundles, so a
    # stale copy pins a browser to a deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # Repeated because `add_header` in a location replaces the inherited set
        # rather than adding to it — a quiet nginx rule that silently drops every
        # security header from exactly the response that needs them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self'__CONNECT_SRC__" always;
    }

    # Every route is the same document (§80.1: the world is navigated by camera,
    # not by pages), so a deep link has to reach it rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
